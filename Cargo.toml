[package]
name = "flip5-root-manager"
version = "0.1.0"
edition = "2024"
description = "Local Rust TUI for orchestrating a known Samsung Galaxy Z Flip5 ADB workflow"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs"] }
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1"

[profile.release]
opt-level = 2
